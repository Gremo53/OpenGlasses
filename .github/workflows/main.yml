name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: ./Scripts/generate-xcodeproj.sh
      - name: Build IPA
        run: |
          xcodebuild -project OpenGlasses.xcodeproj -scheme OpenGlasses -configuration Release -sdk iphoneos -archivePath build/OpenGlasses.xcarchive archive CODE_SIGNING_ALLOWED=NO
          mkdir -p build/Payload
          cp -R build/OpenGlasses.xcarchive/Products/Applications/OpenGlasses.app build/Payload/
          cd build && zip -r OpenGlasses-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OpenGlasses-IPA
          path: build/OpenGlasses-unsigned.ipa
